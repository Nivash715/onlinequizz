<form method="post" class="panel form-panel">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-section-heading"><span class="step-number">01</span><div><h2>The question</h2><p>Keep it clear, focused, and easy to understand.</p></div></div>
  <label for="question">Question <span class="required">*</span></label><textarea id="question" name="question" rows="3" required maxlength="2000" placeholder="What would you like to ask?">{{ data.get('question', '') }}</textarea>
  <div class="form-section-heading"><span class="step-number">02</span><div><h2>Answer options</h2><p>Add four choices and select the correct answer.</p></div></div>
  <div class="form-grid">{% for letter in 'ABCD' %}<div><label for="option_{{ letter|lower }}">Option {{ letter }} <span class="required">*</span></label><input id="option_{{ letter|lower }}" name="option_{{ letter|lower }}" value="{{ data.get('option_' ~ letter|lower, '') }}" required maxlength="300" placeholder="Enter option {{ letter }}"></div>{% endfor %}</div>
  <label for="correct_answer">Correct answer <span class="required">*</span></label><select id="correct_answer" name="correct_answer" required><option value="">Select the correct option</option>{% for letter in 'ABCD' %}<option value="{{ letter }}" {{ 'selected' if data.get('correct_answer') == letter }}>Option {{ letter }}</option>{% endfor %}</select>
  <div class="form-section-heading"><span class="step-number">03</span><div><h2>The details</h2><p>Organize your question for easy discovery.</p></div></div>
  <div class="form-grid"><div><label for="category">Category <span class="required">*</span></label><input id="category" name="category" value="{{ data.get('category', '') }}" required maxlength="300" placeholder="e.g. Science, Python, General knowledge"></div><div><label for="difficulty">Difficulty <span class="required">*</span></label><select id="difficulty" name="difficulty" required><option value="">Choose difficulty</option>{% for value in ['Easy','Medium','Hard'] %}<option {{ 'selected' if data.get('difficulty') == value }}>{{ value }}</option>{% endfor %}</select></div></div>
  <div class="form-actions"><span class="muted">All fields are required.</span><a class="button button-secondary" href="{{ url_for('questions.list_questions') }}">Cancel</a><button class="button" type="submit">{{ submit_label }} <span>→</span></button></div>
</form>
